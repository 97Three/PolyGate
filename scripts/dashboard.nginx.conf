server {
  listen 8080;
  server_name _;

  # Docker's embedded DNS resolver is deliberately used at request time. A
  # literal `proxy_pass http://polygate:38082` is resolved while Nginx loads
  # its configuration and prevents the static dashboard from starting when
  # the backend is absent. Keeping the authority in a variable defers lookup;
  # static assets remain available and API calls receive a bounded 502.
  resolver 127.0.0.11 ipv6=off valid=10s;
  resolver_timeout 2s;
  set $polygate_backend polygate-preview:18080;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 32m;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;

  location /admin/ {
    proxy_pass http://$polygate_backend;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /v1/ {
    proxy_pass http://$polygate_backend;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 600s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /livez {
    proxy_pass http://$polygate_backend;
    proxy_connect_timeout 3s;
  }

  location = /readyz {
    proxy_pass http://$polygate_backend;
    proxy_connect_timeout 3s;
  }

  location = /health {
    proxy_pass http://$polygate_backend;
    proxy_connect_timeout 3s;
  }

  location = /metrics {
    proxy_pass http://$polygate_backend;
    proxy_connect_timeout 3s;
  }

  # Hashed build assets are immutable. A missing asset must stay a 404 instead
  # of falling through to index.html, otherwise browsers parse HTML as a JS
  # module after a rolling frontend deployment.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  # Always revalidate the SPA entry document so a reload picks up the asset
  # manifest from the current container version.
  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

