<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" fill="none" role="img" aria-label="PolyGate 请求链路：客户端、鉴权、协议转换、配额、路由、上游，账本与指标写入 PostgreSQL">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.028"/>
    </pattern>
    <linearGradient id="frame" x1="225" y1="112" x2="770" y2="288" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4a5568"/>
    </marker>
  </defs>

  <rect width="1000" height="430" rx="18" fill="#0b0f17"/>
  <rect width="1000" height="430" rx="18" fill="url(#grid)"/>
  <circle cx="120" cy="20" r="140" fill="#c2536b" fill-opacity="0.14" filter="blur(60px)"/>
  <circle cx="900" cy="420" r="150" fill="#2f6f8f" fill-opacity="0.16" filter="blur(60px)"/>

  <g font-family="'JetBrains Mono', Consolas, 'Microsoft YaHei', monospace" font-size="9" letter-spacing="2.2" fill="#5d6878">
    <text x="40" y="92">客户端</text>
    <text x="225" y="92">POLYGATE · SINGLE JAR</text>
    <text x="800" y="92">上游 UPSTREAMS</text>
  </g>

  <g stroke="#2b3444" fill="#111827">
    <rect x="40" y="118" width="160" height="46" rx="10"/>
    <rect x="40" y="184" width="160" height="46" rx="10"/>
  </g>
  <g font-family="Inter, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" fill="#dbe2ec">
    <text x="60" y="147">Anthropic SDK</text>
    <text x="60" y="213">OpenAI SDK</text>
  </g>
  <g fill="#6b7688" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5" letter-spacing="1">
    <text x="60" y="160">/v1/messages</text>
    <text x="60" y="226">/v1/chat/completions</text>
  </g>

  <rect x="225" y="112" width="540" height="180" rx="16" fill="#0d121c"/>
  <rect x="225.5" y="112.5" width="539" height="179" rx="15.5" stroke="url(#frame)"/>

  <g stroke="#2b3444" fill="#161d2b">
    <rect x="245" y="168" width="112" height="62" rx="10"/>
    <rect x="373" y="168" width="112" height="62" rx="10"/>
    <rect x="501" y="168" width="112" height="62" rx="10"/>
    <rect x="629" y="168" width="112" height="62" rx="10"/>
  </g>

  <g font-family="Inter, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#f2eee7">
    <text x="259" y="194">鉴权</text>
    <text x="387" y="194">协议转换</text>
    <text x="515" y="194">配额预算</text>
    <text x="643" y="194">路由</text>
  </g>
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="8.2" fill="#8b95a5">
    <text x="259" y="212">auth · tenant policy</text>
    <text x="387" y="212">messages ⇄ chat</text>
    <text x="515" y="212">quota · reserve</text>
    <text x="643" y="212">failover · health</text>
  </g>

  <g stroke="#4a5568" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <path d="M357 199H370"/>
    <path d="M485 199H498"/>
    <path d="M613 199H626"/>
    <path d="M200 141H216V199H242"/>
    <path d="M200 207H216V199"/>
    <path d="M741 199H776"/>
  </g>

  <g stroke="#4a5568" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <path d="M776 199V142H797"/>
    <path d="M776 199H797"/>
    <path d="M776 199V256H797"/>
  </g>

  <g stroke="#2f6f8f" fill="#0e131d">
    <rect x="800" y="120" width="168" height="44" rx="10"/>
    <rect x="800" y="177" width="168" height="44" rx="10"/>
    <rect x="800" y="234" width="168" height="44" rx="10"/>
  </g>
  <g font-family="Inter, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" fill="#dbe2ec">
    <text x="818" y="147">Anthropic 兼容</text>
    <text x="818" y="204">OpenAI 兼容</text>
    <text x="818" y="261">本地 Runtime Adapter</text>
  </g>

  <path d="M387 230V306H460V342" stroke="#3a4457" stroke-width="1.1" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/>
  <path d="M557 230V306H540V342" stroke="#3a4457" stroke-width="1.1" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/>
  <text x="394" y="300" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5" fill="#5d6878">metrics</text>
  <text x="566" y="300" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5" fill="#5d6878">ledger</text>

  <rect x="400" y="348" width="200" height="56" rx="12" fill="#0e131d"/>
  <rect x="400.5" y="348.5" width="199" height="55" rx="11.5" stroke="#2f4d3f"/>
  <circle cx="418" cy="368" r="3" fill="#3f8f6a"/>
  <text x="432" y="372" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#dbe2ec">PostgreSQL</text>
  <text x="432" y="389" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5" fill="#6b7688">config · usage · ledger · audit</text>

  <text x="620" y="380" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5" fill="#5d6878">Flyway V1 → V23</text>
</svg>
