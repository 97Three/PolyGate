name: Java verify and release evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: polygate_ci
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POLYGATE_TEST_ADAPTER_TOKEN: fixture-runtime-token
      POLYGATE_TEST_PG_URL: jdbc:postgresql://127.0.0.1:5432/polygate_ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24', cache: npm, cache-dependency-path: dashboard/package-lock.json}
      - run: npm ci && npm run check
        working-directory: dashboard
      - run: sh ./mvnw -B verify
      - run: npm sbom --sbom-format cyclonedx --omit dev > ../target/dashboard-sbom.cdx.json
        working-directory: dashboard
      - run: cp target/classes/META-INF/sbom/application.cdx.json target/bom.json
      - run: docker build -t polygate:ci .
      - run: cd target && sha256sum polygate-1.0.0.jar bom.json dashboard-sbom.cdx.json > SHA256SUMS.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verified-java-release
          path: |
            target/polygate-1.0.0.jar
            target/bom.json
            target/dashboard-sbom.cdx.json
            target/SHA256SUMS.txt
            target/surefire-reports/TEST-*.xml
  attest:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with: {name: verified-java-release, path: artifacts}
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with: {subject-path: artifacts/polygate-1.0.0.jar}
